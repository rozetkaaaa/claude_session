name: claude-session-keeper
on:
  schedule:
    - cron: "3-59/5 * * * *"   # каждые 5 минут (минуты :03, :08, ...)
  workflow_dispatch: {}      # ручной запуск = пинг прямо сейчас
permissions:
  contents: write
concurrency:
  group: keeper
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Qyzylorda
      KEEPER_HOME: /tmp/keeper
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      KEEPER_NOTIFY_URL: ${{ secrets.KEEPER_NOTIFY_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: пора ли пинговать?
        id: due
        run: |
          mkdir -p "$KEEPER_HOME"
          cp config.actions.json "$KEEPER_HOME/config.json"
          [ -f state/state.json ] && cp state/state.json "$KEEPER_HOME/state.json" || true
          ETA=$(python3 keeper.py --eta)
          echo "до пинга, секунд: $ETA"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"; echo "at=0" >> "$GITHUB_OUTPUT"
          elif [ "$ETA" -le 360 ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"; echo "at=$(( $(date +%s) + ETA + 2 ))" >> "$GITHUB_OUTPUT"
          else
            echo "рано, выхожу"
          fi
      - if: steps.due.outputs.due == 'true'
        uses: actions/setup-node@v4
        with: { node-version: "22" }
      - if: steps.due.outputs.due == 'true'
        run: npm i -g @anthropic-ai/claude-code
      - if: steps.due.outputs.due == 'true'
        name: ждать точного времени
        run: |
          AT=${{ steps.due.outputs.at }}; NOW=$(date +%s)
          if [ "$AT" -gt "$NOW" ]; then echo "жду $((AT-NOW)) с"; sleep $((AT-NOW)); fi
      - if: steps.due.outputs.due == 'true'
        name: пинг
        run: python3 keeper.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - if: steps.due.outputs.due == 'true'
        name: сохранить состояние
        run: |
          mkdir -p state
          [ -f "$KEEPER_HOME/state.json" ] && cp "$KEEPER_HOME/state.json" state/state.json || true
          git config user.name "keeper-bot"; git config user.email "keeper-bot@users.noreply.github.com"
          git add state/state.json
          if ! git diff --cached --quiet; then git commit -m "keeper state [skip ci]" && git push; fi
