name: claude-session-keeper
on:
  schedule:
    - cron: "*/30 * * * *"   # быстрая проверка; сам пинг уходит только когда окно кончилось (~5 раз в сутки)
  workflow_dispatch: {}      # ручной запуск = пинг прямо сейчас (запускает цикл)
permissions:
  contents: write
concurrency:
  group: keeper
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TZ: Asia/Qyzylorda
      KEEPER_HOME: /tmp/keeper
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      KEEPER_NOTIFY_URL: https://ntfy.sh/claude_session
    steps:
      - uses: actions/checkout@v4
      - name: пора ли пинговать?
        id: due
        run: |
          mkdir -p "$KEEPER_HOME"
          cp config.actions.json "$KEEPER_HOME/config.json"
          [ -f state/state.json ] && cp state/state.json "$KEEPER_HOME/state.json" || true
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || python3 keeper.py --check; then echo "due=true" >> "$GITHUB_OUTPUT"; else echo "рано, выхожу"; fi
      - if: steps.due.outputs.due == 'true'
        uses: actions/setup-node@v4
        with: { node-version: "22" }
      - if: steps.due.outputs.due == 'true'
        run: npm i -g @anthropic-ai/claude-code
      - if: steps.due.outputs.due == 'true'
        name: пинг
        run: python3 keeper.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - if: steps.due.outputs.due == 'true'
        name: сохранить состояние
        run: |
          mkdir -p state
          [ -f "$KEEPER_HOME/state.json" ] && cp "$KEEPER_HOME/state.json" state/state.json || true
          git config user.name "keeper-bot"; git config user.email "keeper-bot@users.noreply.github.com"
          git add state/state.json
          if ! git diff --cached --quiet; then git commit -m "keeper state [skip ci]" && git push; fi
