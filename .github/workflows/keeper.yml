name: claude-session-keeper
on:
  workflow_dispatch: {}      # запускает Cloudflare Worker в момент сброса окна (или вы вручную: пинг сразу)
permissions:
  contents: read
concurrency:
  group: keeper
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Asia/Qyzylorda
      KEEPER_HOME: /tmp/keeper
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      KEEPER_NOTIFY_URL: ${{ secrets.KEEPER_NOTIFY_URL }}
      KEEPER_REPORT_URL: ${{ secrets.KEEPER_REPORT_URL }}
      KEEPER_REPORT_SECRET: ${{ secrets.KEEPER_REPORT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm i -g @anthropic-ai/claude-code
      - name: пинг и отчёт в Worker
        run: |
          mkdir -p "$KEEPER_HOME"
          cp config.actions.json "$KEEPER_HOME/config.json"
          python3 keeper.py --force
