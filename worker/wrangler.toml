name = "claude-keeper"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[durable_objects.bindings]]
name = "KEEPER"
class_name = "Keeper"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Keeper"]

[vars]
GH_REPO = "rozetkaaaa/claude_session"
GH_WORKFLOW = "keeper.yml"
GH_BRANCH = "main"
TZ_OFFSET_H = "5"          # Asia/Qyzylorda = UTC+5
ACTIVE_FROM = ""           # например "07:00"; пусто = круглосуточно
ACTIVE_TO = ""             # например "23:30"
MAX_PINGS_PER_DAY = "6"
NTFY_URL = "https://ntfy.sh/claude_session"   # уведомления; подпишитесь на этот топик в приложении ntfy
# Секреты (не здесь!): GH_TOKEN, REPORT_SECRET  -> wrangler secret put <ИМЯ>
